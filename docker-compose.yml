name: miners-online-games
services:
  proxy:
    image: itzg/mc-proxy:latest
    restart: unless-stopped
    working_dir: /data
    environment:
      - TYPE=VELOCITY
      - MINECRAFT_VERSION=26.3
      - REPLACE_ENV_VARIABLES=TRUE
      - VELOCITY_FORWARDING_SECRET=${VELOCITY_FORWARDING_SECRET}
      - MODRINTH_PROJECTS=simple-voice-chat:velocity-2.6.26
    volumes:
      - ./config/proxy/velocity.toml:/config/velocity.toml:ro
      - ./config/proxy/forwarding.secret.yml:/config/forwarding.secret.yml:ro
      - proxy:/server
    ports:
      - '25565:25565' # Java Edition
      - '19132:19132/udp' # Bedrock Edition (udp)
      - '19132:19132/tcp' # Bedrock Edition (tcp)
    networks:
      - game-core
      - minecraft

  limbo:
    image: ghcr.io/quozul/picolimbo:latest
    restart: unless-stopped
    environment:
      - VELOCITY_FORWARDING_SECRET=${VELOCITY_FORWARDING_SECRET}
    volumes:
      - type: bind
        source: ./config/limbo/server.toml
        target: /usr/src/app/server.toml
    networks:
      - game-core
      - minecraft

networks:
  game-core:
    external: true
  minecraft:
    external: true
  # No traefik network needed here, this is a game server, not a web service.

volumes:
  proxy:
