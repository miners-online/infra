name: miners-online-games
services:
  gate:
    image: ghcr.io/minekube/gate/jre:latest
    restart: unless-stopped
    container_name: gate
    working_dir: /data
    environment:
      - GATE_CONFIG=/config/gate.yml
    volumes:
      - ./config/gate:/config/:ro
      - gate-cache:/var/cache/gate
      - gate-data:/data
    ports:
      - '25565:25565' # Java Edition
      - '19132:19132/udp' # Bedrock Edition
    networks:
      - game-core
      - minecraft

  limbo:
    image: ghcr.io/quozul/picolimbo:latest
    restart: unless-stopped
    container_name: limbo
    volumes:
      - type: bind
        source: ./config/limbo/server.toml
        target: /usr/src/app/server.toml
    networks:
      - game-core
      - minecraft

networks:
  game-core:
    external: true
  minecraft:
    external: true
  # No traefik network needed here, this is a game server, not a web service.

volumes:
  gate-cache:
  gate-data:
